<!doctype html>
<html lang="en">
  <head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App" />

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Web Components for shared navbar and footer layout -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
  </head>

  <body>
    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>

    <!-- our own navbar goes here -->
    <site-navbar></site-navbar>

    <!-- Main content goes here -->
    <div class="container py-5 text-center">
      <h1>You are logged in to VerosikaHikes!</h1>
      <h2>Hello, <span id="name-goes-here"></span></h2>
      <p>Quote of the day: <span id="quote-goes-here"></span></p>
    </div>

    <div class="container py-4">
      <a class="btn btn-success mb-3" href="addHike.html"> + Add a hike </a>
      <h2>Popular Hike</h2>
      <div id="hikes-go-here" class="row g-3"></div>
    </div>

    <template id="hikeCardTemplate">
      <div class="col-md-4">
        <div class="card h-100">
          <img class="card-img-top card-image" alt="Hike image" />
          <i
            class="bi bi-heart text-danger fs-4 fav-btn position-absolute top-0 end-0 m-2"
            role="button"
            title="Favourite"
          ></i>
          <div class="card-body">
            <h5 class="card-title"></h5>
            <p class="card-text"></p>
            <p>Length: <span class="card-length"></span>km</p>
            <a class="btn btn-primary read-more" href="#">Read More</a>
          </div>
        </div>
      </div>
    </template>

    <!-- our own footer goes here -->
    <site-footer></site-footer>

    <!---------------------------------------------->
    <!-- Your own JavaScript scripts go here      -->
    <!---------------------------------------------->

    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
